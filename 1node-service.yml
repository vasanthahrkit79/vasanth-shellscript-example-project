---
apiVersion: v1
kind: Pod
metadata:
  name: test-nginx-pod
  labels:
    app: test-web
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: test-nginx-service
spec:
  type: NodePort
  selector:
    app: test-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
